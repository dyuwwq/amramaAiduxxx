<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050806">
<title>AIDUX — AR Навигация</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050806;color:#fff}
body{font-family:Inter,system-ui,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#050806;z-index:0}
#shade{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.52),transparent 32%,transparent 65%,rgba(0,0,0,.68))}
#top{position:fixed;top:0;left:0;right:0;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:center}
.glass{background:rgba(6,14,10,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(0,0,0,.25)}
#back{width:44px;height:44px;border-radius:14px;color:#fff;border:1px solid rgba(255,255,255,.12);background:rgba(6,14,10,.78);font-size:20px}
#search{height:44px;flex:1;display:flex;gap:6px;padding:5px;border-radius:14px}
#input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#fff;padding:0 10px;font-size:15px}
#go{border:0;border-radius:10px;background:#36d36f;color:#041008;font-weight:900;padding:0 15px}
#status{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;border-radius:18px;padding:13px 15px;text-align:center;font-size:14px}
#debug{position:fixed;left:12px;top:calc(68px + env(safe-area-inset-top));z-index:10;border-radius:13px;padding:8px 10px;font-size:11px;color:#cfe3d5;line-height:1.45;display:none}
#start{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#07130c,#030705)}
.start-card{width:min(430px,calc(100% - 28px));padding:28px;border-radius:28px;text-align:center}
.start-icon{width:66px;height:66px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,#36d36f,#167b3c);font-size:28px;color:#041008}
.start-card h1{font-size:2rem;letter-spacing:-.04em;margin:0 0 8px}.start-card p{color:#9aaba0;font-size:.93rem;margin:0 0 20px}
#startBtn{width:100%;height:56px;border:0;border-radius:16px;background:#36d36f;color:#041008;font-weight:900;font-size:16px}
#permissionNote{margin-top:12px;color:#718077;font-size:11px}
#compass{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(180px,58vw,270px);height:clamp(180px,58vw,270px);pointer-events:none;display:none}
#arrow3d{position:absolute;left:50%;top:50%;width:110px;height:150px;transform:translate(-50%,-50%);filter:drop-shadow(0 12px 22px rgba(0,0,0,.6));transition:transform .12s linear}
.arrow-head{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:0;height:0;border-left:42px solid transparent;border-right:42px solid transparent;border-bottom:78px solid #36d36f}
.arrow-shaft{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:28px;height:75px;border-radius:10px;background:linear-gradient(90deg,#167d3f,#70f59a,#167d3f)}
.arrow-glow{position:absolute;inset:20px 8px;filter:blur(18px);background:rgba(54,211,111,.32);border-radius:50%}
#distance{position:fixed;z-index:9;left:50%;top:calc(50% + clamp(110px,32vw,145px));transform:translateX(-50%);display:none;white-space:nowrap;padding:8px 13px;border-radius:999px;font-weight:900;font-size:13px}
#results{position:fixed;z-index:15;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top));max-height:45vh;overflow:auto;border-radius:18px;padding:8px;display:none}
.result{padding:12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:6px}.result b{display:block;font-size:14px}.result span{display:block;color:#9aaba0;font-size:11px;margin-top:3px}
#controls{position:fixed;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:11;display:grid;gap:8px}
.ctrl{width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.12);color:#fff;font-size:18px}
#mapBtn{display:none}
@media(min-width:700px){#debug{display:block}#status{left:50%;right:auto;width:520px;transform:translateX(-50%)}}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no"></head>
<body>
<video id="video" autoplay muted playsinline></video><div id="shade"></div>

<div id="start">
 <div class="start-card glass">
  <div class="start-icon">◈</div>
  <h1>AIDUX AR</h1>
  <p>Камера + GPS + компас. Навигационная стрелка будет показывать направление к следующей точке маршрута.</p>
  <button id="startBtn">Запустить AR-навигацию</button>
  <div id="permissionNote">Нужны разрешения камеры, геолокации и датчиков ориентации.</div>
 </div>
</div>

<div id="top">
 <button id="back" class="glass">‹</button>
 <div id="search" class="glass"><input id="input" placeholder="Куда? Адрес или место"><button id="go">Найти</button></div>
</div>
<div id="results" class="glass"></div>
<div id="debug" class="glass">GPS: —<br>Точность: —<br>Компас: —<br>Цель: —</div>

<div id="compass"><div id="arrow3d"><div class="arrow-glow"></div><div class="arrow-head"></div><div class="arrow-shaft"></div></div></div>
<div id="distance" class="glass">—</div>

<div id="controls">
 <button id="centerBtn" class="ctrl glass">◎</button>
 <button id="calibrateBtn" class="ctrl glass">🧭</button>
</div>
<div id="status" class="glass">Подготовка…</div>

<script>
const video=document.getElementById('video'), start=document.getElementById('start');
const statusEl=document.getElementById('status'), debug=document.getElementById('debug');
const input=document.getElementById('input'), results=document.getElementById('results');
const arrow=document.getElementById('arrow3d'), compass=document.getElementById('compass'), distanceEl=document.getElementById('distance');
let stream=null,user=null,heading=null,headingOffset=0,target=null,route=[],step=0,lastRouteAt=0;
let lastLat=null,lastLng=null;

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function status(t){statusEl.textContent=t}
function dist(a,b){
 const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180;
 const dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;
 const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function bear(a,b){
 const p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;
 const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function delta(a,b){return ((a-b+540)%360)-180}
function fmt(m){return m<1000?Math.round(m)+' м':(m/1000).toFixed(1)+' км'}

async function startAR(){
 try{
  if(!window.isSecureContext && location.hostname!=='localhost'){throw new Error('SECURE')}
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('CAMERA');
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  video.srcObject=stream; await video.play();
  if(navigator.geolocation) navigator.geolocation.watchPosition(onGPS,onGPSErr,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});
  await requestSensors();
  start.style.display='none'; compass.style.display='block';
  status('Камера запущена. Разреши GPS и выбери адрес.');
 }catch(e){
  console.error(e);
  if(e.message==='SECURE')status('Камера требует HTTPS. На ПК можно использовать localhost.');
  else if(e.name==='NotAllowedError')status('Доступ к камере/датчикам запрещён. Разреши его в настройках браузера.');
  else status('Не удалось запустить камеру. Проверь разрешения и наличие камеры.');
 }
}
async function requestSensors(){
 try{
  if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
   const o=await DeviceOrientationEvent.requestPermission(true);
   if(o!=='granted')throw new Error('orientation');
  }
  if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
   const m=await DeviceMotionEvent.requestPermission();
   if(m!=='granted')throw new Error('motion');
  }
  window.addEventListener('deviceorientationabsolute',onOrientation,true);
  window.addEventListener('deviceorientation',onOrientation,true);
 }catch(e){status('Камера работает, но компас не разрешён. Нажми 🧭 и разреши датчики.')}
}
function onOrientation(e){
 let h=null;
 if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;
 else if(typeof e.alpha==='number') h=(360-e.alpha)%360;
 if(h!==null && Number.isFinite(h)){heading=h; updateArrow()}
}
function onGPS(pos){
 user={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
 debug.innerHTML=`GPS: ${user.lat.toFixed(6)}, ${user.lng.toFixed(6)}<br>Точность: ±${Math.round(user.accuracy)} м<br>Компас: ${heading===null?'—':Math.round(heading)+'°'}<br>Цель: ${target?target.name:'—'}`;
 if(user.accuracy>40)status('GPS слабый: ±'+Math.round(user.accuracy)+' м. Выйди на открытое место.');
 if(target && Date.now()-lastRouteAt>15000 && (!lastLat || dist(user,{lat:lastLat,lng:lastLng})>25)){buildRoute(false)}
 updateArrow()
}
function onGPSErr(){status('GPS недоступен. Разреши геолокацию в браузере.')}
function updateArrow(){
 if(!user||!route[step]||heading===null){distanceEl.textContent=target?'Ищу направление…':'—';return}
 let d=dist(user,route[step]);
 if(d<8){step++; if(step>=route.length){distanceEl.textContent='Вы прибыли 🎉';status('Вы прибыли!');return} d=dist(user,route[step])}
 const tb=bear(user,route[step]), rel=delta(tb,(heading+headingOffset+360)%360);
 // Keep arrow on screen, rotate horizontally toward target.
 arrow.style.transform=`translate(-50%,-50%) rotate(${rel}deg) scale(${clamp(1.15-d/250,0.72,1.05)})`;
 distanceEl.style.display='block';distanceEl.textContent=fmt(d);
 status(Math.abs(rel)<15?'Идите прямо • '+fmt(d):rel>0?'Поверните направо • '+fmt(d):'Поверните налево • '+fmt(d));
}
async function searchAddress(q){
 results.style.display='block';results.innerHTML='<div class="result">🔎 Ищем…</div>';
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&addressdetails=1&q='+encodeURIComponent(q));
  const items=await r.json();results.innerHTML='';
  if(!items.length){results.innerHTML='<div class="result"><b>Ничего не найдено</b><span>Добавь город, улицу или номер дома.</span></div>';return}
  items.forEach(x=>{
   const d=document.createElement('div');d.className='result';d.innerHTML=`<b>${x.name||x.display_name.split(',')[0]}</b><span>${x.display_name}</span>`;
   d.onclick=()=>selectTarget({name:x.name||x.display_name.split(',')[0],lat:+x.lat,lng:+x.lon});
   results.appendChild(d);
  });
 }catch(e){results.innerHTML='<div class="result"><b>Поиск недоступен</b><span>Проверь интернет.</span></div>'}
}
async function selectTarget(t){
 target=t;results.style.display='none';input.value=t.name;step=0;route=[];await buildRoute(true);
}
async function buildRoute(first){
 if(!user||!target){status('Ожидаю GPS…');return}
 try{
  const url=`https://router.project-osrm.org/route/v1/foot/${user.lng},${user.lat};${target.lng},${target.lat}?overview=full&geometries=geojson&steps=true`;
  const r=await fetch(url),data=await r.json();if(data.code!=='Ok')throw new Error('route');
  const raw=data.routes[0].geometry.coordinates.map(c=>({lat:c[1],lng:c[0]}));
  route=[];for(const p of raw)if(!route.length||dist(route.at(-1),p)>=15)route.push(p);
  route.push(target);step=0;lastRouteAt=Date.now();lastLat=user.lat;lastLng=user.lng;updateArrow();
  status('Маршрут готов • '+fmt(data.routes[0].distance));
 }catch(e){status('Не удалось построить маршрут. Проверь интернет.')}
}
document.getElementById('startBtn').onclick=startAR;
document.getElementById('go').onclick=()=>{if(input.value.trim())searchAddress(input.value.trim())};
input.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('go').click()});
document.getElementById('back').onclick=()=>{stream?.getTracks().forEach(t=>t.stop());location.href='map.html'};
document.getElementById('centerBtn').onclick=()=>{if(target)updateArrow()};
document.getElementById('calibrateBtn').onclick=async()=>{headingOffset=0;await requestSensors();status('Компас откалиброван. Держи телефон вертикально и повернись на месте.')};
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script></body></html>
