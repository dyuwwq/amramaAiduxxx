services:
  - type: web
    name: aidux
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
