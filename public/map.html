<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>AIDUX — Карта</title>
<link href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="places.css">
<style>
body{overflow:hidden;background:#050b08}.map-shell{position:fixed;inset:76px 0 0}.map{position:absolute;inset:0}
.map-ui{position:absolute;z-index:20;left:18px;top:18px;width:min(410px,calc(100% - 36px));display:grid;gap:10px}
.panel{background:rgba(7,17,13,.88);border:1px solid rgba(255,255,255,.11);backdrop-filter:blur(20px);box-shadow:0 18px 55px rgba(0,0,0,.3);border-radius:20px;padding:12px;max-width:100%;overflow-x:hidden}
.search{display:flex;gap:8px}.search input{min-width:0;flex:1;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.06);color:#fff;border-radius:13px;padding:13px 14px;outline:none}.search button{border:0;background:#36d36f;color:#061109;border-radius:13px;font-weight:900;padding:0 16px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:8px}.quick button,.map-actions button{min-width:0;overflow-wrap:break-word;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#dce7df;border-radius:12px;padding:10px 7px;font-size:.78rem}.quick button:hover,.map-actions button:hover{background:rgba(54,211,111,.12)}
.categories{display:flex;gap:6px;overflow:auto;padding-bottom:2px;margin-top:8px}.categories button{white-space:nowrap;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#dce7df;border-radius:999px;padding:8px 10px;font-size:.76rem}
.place-search{margin-top:10px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07)}
.place-search-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.place-search-head strong{font-size:.86rem}.place-search-head span{font-size:.7rem;color:#84968b}
.place-query{display:flex;gap:7px}.place-query input{min-width:0;flex:1;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:11px 12px;outline:none}
.place-query button{border:0;background:#36d36f;color:#061109;border-radius:12px;font-weight:900;padding:0 13px}
.place-presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:7px}
.place-presets button{min-width:0;overflow-wrap:break-word;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);color:#dce7df;border-radius:11px;padding:9px 5px;font-size:.72rem;line-height:1.15}
.place-presets button:hover,.place-presets button.active{background:rgba(54,211,111,.15);border-color:rgba(54,211,111,.35);color:#fff}
.place-hint{margin-top:7px;color:#829389;font-size:.69rem}
.place-result{position:relative}.place-distance{float:right;color:#9cffb2;font-size:.72rem;font-weight:800}
@media(max-width:620px){.place-presets{grid-template-columns:repeat(2,minmax(0,1fr))}.place-query button{padding:0 11px}}

.info{display:flex;justify-content:space-between;gap:12px;align-items:center}.info small{color:#8fa096}.info strong{font-size:.88rem}
.map-tools{position:absolute;right:18px;top:18px;z-index:20;display:grid;gap:8px}.round{width:46px;height:46px;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:rgba(7,17,13,.9);color:#fff;font-size:18px;backdrop-filter:blur(12px)}
.bottom-card{position:absolute;z-index:20;left:18px;bottom:18px;width:min(410px,calc(100% - 36px));background:rgba(7,17,13,.92);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:15px;backdrop-filter:blur(20px)}
.route-row{display:flex;gap:12px;align-items:center}.route-dot{width:11px;height:11px;border-radius:50%;background:#36d36f;box-shadow:0 0 0 6px rgba(54,211,111,.1)}.route-line{height:24px;border-left:1px dashed rgba(156,255,178,.35);margin-left:5px}.route-dest{width:11px;height:11px;border-radius:50%;background:#fff;display:block;box-shadow:0 0 0 5px rgba(255,255,255,.08)}
.route-results{display:none;margin-top:8px;max-height:240px;overflow:auto}.result{padding:11px 12px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.035);border-radius:12px;margin-top:6px;cursor:pointer}.result:hover{background:rgba(54,211,111,.1)}.result b{display:block;font-size:.9rem}.result span{display:block;color:#899a90;font-size:.76rem;margin-top:2px}
.route-actions{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.route-actions button{padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#fff}.route-actions button.active{background:#36d36f;color:#041008}
.map-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}.map-actions button{font-size:.75rem}
.favorite{color:#ffd86b!important}
.globe-badge{position:absolute;z-index:12;right:18px;bottom:18px;background:rgba(7,17,13,.82);border:1px solid rgba(255,255,255,.1);padding:8px 11px;border-radius:999px;color:#bcd0c3;font-size:.72rem;backdrop-filter:blur(12px)}
.marker-pin{width:18px;height:18px;border-radius:50%;background:#36d36f;border:3px solid #eaffef;box-shadow:0 0 0 7px rgba(54,211,111,.18),0 5px 18px rgba(0,0,0,.35)}
@media(max-width:620px){
  .map-shell{inset:64px 0 0}
  .map-ui{position:fixed!important;top:auto!important;left:0!important;right:0!important;bottom:0!important;width:100%!important;max-width:100%!important;grid-template-columns:minmax(0,1fr)!important;max-height:min(62dvh,560px)!important;overflow-y:auto!important;overflow-x:hidden!important;padding:0 10px calc(10px + env(safe-area-inset-bottom))!important;z-index:100!important;display:grid!important;gap:8px!important;transform:translateY(100%);opacity:0;visibility:hidden;pointer-events:none;transition:transform .22s ease,opacity .18s ease,visibility 0s linear .22s}
  .map-ui.mobile-open{transform:translateY(0);opacity:1;visibility:visible;pointer-events:auto;transition:transform .22s ease,opacity .18s ease}
  .map-ui>.panel:first-child{position:relative!important;max-height:none!important;overflow:hidden!important;min-width:0!important;width:100%!important;padding:12px 10px 10px!important;border-radius:18px 18px 0 0!important}
  .map-ui>.panel.info{display:none!important}
  .search{padding-right:40px!important}.search input{padding:11px 10px!important;font-size:.86rem!important}.search button{padding:0 11px!important;font-size:.78rem!important}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important}.quick button{padding:8px 5px!important;font-size:.7rem!important}.quick button:nth-child(3){grid-column:1/-1}
  .categories{gap:5px!important;min-width:0!important;max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}.categories button{padding:7px 8px!important;font-size:.69rem!important}
  .place-search{margin-top:8px!important;padding-top:9px!important}.place-query input{padding:9px 10px!important;font-size:.78rem!important}.place-query button{padding:0 9px!important;font-size:.72rem!important}.place-presets{gap:5px!important}.place-presets button{padding:8px 4px!important;font-size:.67rem!important}.place-hint{font-size:.63rem!important}
  .map-tools{right:10px!important;top:72px!important;z-index:30}.bottom-card{left:10px;bottom:10px;width:calc(100% - 20px);padding:13px}.globe-badge{right:10px;bottom:92px}
  .mobile-search-toggle{display:grid!important;position:fixed!important;z-index:110!important;right:max(10px,env(safe-area-inset-right))!important;top:max(70px,calc(env(safe-area-inset-top) + 58px))!important;width:42px!important;height:42px!important;place-items:center;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(7,17,13,.94);color:#fff;font-size:19px;box-shadow:0 10px 28px rgba(0,0,0,.35);backdrop-filter:blur(14px)}
  .mobile-search-close{display:grid!important;position:absolute!important;top:7px!important;right:7px!important;width:32px!important;height:32px!important;place-items:center!important;padding:0!important;border:1px solid rgba(255,255,255,.13)!important;border-radius:10px!important;background:rgba(255,255,255,.07)!important;color:#fff!important;font-size:16px!important;line-height:1!important}
}
@media(min-width:621px){.mobile-search-toggle,.mobile-search-close{display:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07110d">
</head>
<body>
<header class="topbar"><div class="shell topbar-inner">
 <a class="brand" href="index.html"><span class="brand-mark">⌖</span>AIDUX</a>
 <nav class="nav"><a href="index.html">Главная</a><a class="active" href="map.html">3D-карта</a><a href="ar-nav.html">AR-навигация</a><a href="vr.html">VR</a><a class="nav-ai" href="ai-chat.html">✦ AIDUX AI</a><a href="about.html">О проекте</a></nav>
 <button class="mobile-menu" onclick="document.querySelector('.nav').classList.toggle('open')">☰</button>
</div></header>

<div class="map-shell">
 <div id="map" class="map"></div>

 <button class="mobile-search-toggle" id="mobileSearchToggle" type="button" aria-label="Открыть поиск" aria-expanded="false">⌕</button>

 <div class="map-ui">
  <div class="panel">
   <button class="mobile-search-close" id="mobileSearchClose" type="button" aria-label="Закрыть поиск">✕</button>
   <div class="search"><input id="target-input" autocomplete="off" placeholder="Город, улица, место…"><button id="go-btn">Найти</button></div>
   <div class="quick">
    <button id="locateBtn">◎ Моё местоположение</button>
    <button id="arBtn">◈ AR-маршрут</button>
    <button id="shareBtn">↗ Поделиться</button>
   </div>
   <div class="categories">
    <button data-cat="кафе">☕ Кафе</button><button data-cat="ресторан">🍴 Рестораны</button><button data-cat="аптека">💊 Аптеки</button><button data-cat="банкомат">🏧 Банкоматы</button><button data-cat="достопримечательность">📍 Достопримечательности</button>
   </div>
   <div class="place-search">
    <div class="place-search-head"><strong>✦ Поиск мест рядом</strong><span id="placeScope">рядом</span></div>
    <div class="place-query"><input id="placeInput" autocomplete="off" placeholder="Например: где поесть…"><button id="placeGo">Искать</button></div>
    <div class="place-presets">
     <button data-place="food">🍴 Где поесть</button>
     <button data-place="billiards">🎱 Бильярд</button>
     <button data-place="birthday">🎂 День рождения</button>
     <button data-place="coffee">☕ Кофе</button>
     <button data-place="sport">🏀 Спорт</button>
     <button data-place="entertainment">🎮 Развлечения</button>
    </div>
    <div class="place-hint">Выбери категорию — AIDUX найдёт подходящие места поблизости и покажет их на карте.</div>
   </div>
   <div id="results" class="route-results"></div>
   <div id="routeActions" class="route-actions"><button id="driveBtn" class="active">🚗 Авто</button><button id="walkBtn">🚶 Пешком</button><button id="bikeBtn">🚲 Вело</button></div>
   <div class="map-actions"><button id="globeBtn">🌍 Глобус</button><button id="pickBtn">📌 Я здесь (на карте)</button><button id="buildingsBtn">🏙️ 3D-здания</button><button id="favoritesBtn">★ Избранное</button></div>
  </div>
  <div class="panel info"><div><small id="statusLabel">Статус</small><br><strong id="status">Карта Костаная</strong></div><span class="pill" id="modePill">2D</span></div>
 </div>

 <div class="map-tools"><button class="round" id="zoomIn">+</button><button class="round" id="zoomOut">−</button><button class="round" id="reset" title="К Костанаю">⌂</button><button class="round" id="pitch">3D</button></div>
 <div class="bottom-card"><div class="kicker">AIDUX · КОСТАНАЙ</div><div class="route-row" style="margin-top:8px"><span class="route-dot"></span><div><strong id="placeTitle">Костанай</strong><div class="route-line"></div><span class="route-dest"></span></div><div><strong id="destName">Выберите место</strong><div id="routeMeta" style="color:#8fa096;font-size:.82rem">Поиск, маршруты и AR</div></div></div></div>
 <div class="globe-badge">🌐 OpenStreetMap · OpenFreeMap · MapLibre</div>
</div>

<script src="map.js"></script>
</body>
</html>
